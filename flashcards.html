<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IE471 Flashcards</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a65;--acc:#2f5fd0;--ok:#1f8a4c;--no:#c0392b;--line:#dcdad2}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#222221;--ink:#eeede8;--mut:#a09f98;--acc:#7da2ff;--ok:#4cc27d;--no:#ef7a6d;--line:#3a3a38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.ok{border-color:var(--ok);color:var(--ok)}button.no{border-color:var(--no);color:var(--no)}
.stat{color:var(--mut);font-size:14px;margin-left:auto}
.scene{perspective:1200px;margin:8px 0 14px}
.card{position:relative;min-height:320px;cursor:pointer;transition:transform .45s;transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;overflow:auto;display:flex;flex-direction:column}
.back{transform:rotateY(180deg)}
.tag{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.q{font-size:20px;font-weight:600;margin:auto 0}
.a{font-size:16px;white-space:pre-wrap}
.hint{font-size:12px;color:var(--mut);margin-top:auto;padding-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1;min-width:110px}
@media (max-width:480px){.q{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<h1>IE471 Systems Engineering — Flashcards</h1>
<div class="bar">
<select id="cat"></select>
<select id="mode"><option value="all">All cards</option><option value="unk">Only ones I don't know</option></select>
<button id="shuf">Shuffle</button>
<button id="reset">Reset</button>
<span class="stat" id="stat"></span>
</div>
<div class="scene"><div class="card" id="card">
<div class="face front"><div class="tag" id="tagF"></div><div class="q" id="q"></div><div class="hint">Tap the card or press Space to flip</div></div>
<div class="face back"><div class="tag" id="tagB"></div><div class="a" id="a"></div></div>
</div></div>
<div class="row">
<button id="prev">← Prev</button>
<button class="no" id="bad">Don't know</button>
<button class="ok" id="good">Know it</button>
<button class="p" id="next">Next →</button>
</div>
</div>
<script>
const C=[
// DEFINITIONS
["Definitions","What is a system?","A set of interrelated components that interact within a boundary, in an environment, for a common purpose, and that shows behaviour (emergence) that none of the parts shows alone.\nCourse emphasis: we recognize a system by its BEHAVIOUR; there is no generic model in SE.\nAristotle/Hall: the whole is more than the sum of its parts."],
["Definitions","What are the basic elements of a system?","Purpose, components, relationships/interactions, boundary, environment, inputs and outputs, behaviour."],
["Definitions","What is an open system?","A system that exchanges energy, matter and information with its environment: it imports inputs, transforms them, exports outputs, and survives through negative entropy.\nExamples: living cell, human, company, university, cafe, ECM/procurement system."],
["Definitions","What is a closed system?","A system that does not exchange matter/energy/information with its environment. With no incoming order, entropy increases (2nd law of thermodynamics) and the system runs down to equilibrium.\nIdealized examples: an insulated thermos, a sealed reaction vessel. No real system is perfectly closed."],
["Definitions","Open vs closed system: differences?","Exchange with environment: open YES / closed NO.\nEntropy: open keeps it low via negative entropy / closed it rises.\nFeedback and adaptation: open has homeostasis, equifinality / closed little or none."],
["Definitions","What are the inputs of a system?","Whatever it takes from the environment: energy, matter, information (plus people, money/budget, demand).\nCourse link: importation of energy (characteristic 1) and information input (characteristic 6). Input → throughput → output.\nECM: ECRs, customer complaints, quality problems. Procurement: PRs, budget, quotes."],
["Definitions","What is entropy?","A measure of disorder. 2nd law of thermodynamics: in a closed system entropy increases (disorder grows, usable energy is lost)."],
["Definitions","What is negative entropy? Give examples.","Order an open system keeps importing from its environment (energy, information, resources) to reduce or offset entropy. Without it the system stops.\nExamples: living being: food, sleep, learning; company: new orders, investment, training; building: maintenance; procurement: new requests, budget, approval limits."],
["Definitions","Examples of entropy increasing?","Aging and disease; a company with messy processes, incomplete forms, lost motivation; a decaying building; a messy room; procurement with incomplete PRs, mismatched invoices, everything 'urgent'."],
["Definitions","Complex vs complicated? (Ottino)","Complicated: many parts, each with a strictly defined function (Boeing, watch).\nComplex: simple parts but rich, unpredictable collective behaviour (school of fish, market, game of Go); order emerges with no central organizer."],
// WEEK 1
["Week 1","What is Cartesian reductionism?","Breaking big things into smaller understandable parts, assuming that explaining the parts explains the whole (Descartes). It fails for complex systems: the parts do not explain the whole."],
["Week 1","Why did systems philosophy emerge?","Scientists noticed not everything is amenable to reductionism; some things function only as wholes. These were called 'complex' systems or 'complexes'."],
["Week 1","What does Complex Systems Engineering do?","Puts all engineering disciplines together to tackle complexity instead of splitting it into specific complicated science parts."],
["Week 1","What does the Deepwater Coast Guard example show?","A System of Systems (SoS): helicopters, aircraft, cutters, GPS satellite, ground station, people, computers integrated. Key feature: interoperability among all assets and with local and federal authorities."],
["Week 1","Solved vs resolved vs dissolved?","Solved: a direct solution. Resolved: re-solved for the optimum. Dissolved: the problem is made to disappear.\nCold classroom example: turn on the heater / redefine the problem (maybe one person is ill) / move to the next classroom (zero cost, dissolved)."],
["Week 1","Three groups of information (Starry Night)?","Group 1: WHAT? (what is seen/known) → one axis X.\nGroup 2: WHERE? (where is the painter standing) → X–Y plane; the paradigm change starts here.\nGroup 3: WHO? (culture, civilization, identity, belonging) → X–Y–Z.\nMore viewpoints multiply the solution space (e.g. 2×3=6)."],
["Week 1","What is the instructor's SE motto?","'There is no \"I cannot\" in SE. There is no problem.' Always widen your solution space."],
// WEEK 2
["Week 2","List the 9 characteristics of open systems.","1 Importation of energy\n2 Throughput\n3 Output\n4 Systems as cycles of events\n5 Negative entropy\n6 Information input, negative feedback, coding/categorization\n7 Steady state and dynamic homeostasis\n8 Differentiation\n9 Equifinality"],
["Week 2","What is throughput?","The transformation and transport of imported energy/input inside the system. E.g. ECM: ECR evaluated → approved → turned into an ECO."],
["Week 2","What are cycles of events?","Output becomes the source of new input; the system works in cycles. E.g. sales revenue finances the purchase of raw material."],
["Week 2","Characteristic 6: information, feedback, coding?","Data → (observe) Information → (interaction) Knowledge → (process) Intelligence.\nNegative feedback returns the system toward its goal; coding/categorization sorts information."],
["Week 2","What is homeostasis?","Steady state and dynamic equilibrium: the system keeps its balance dynamically despite disturbances."],
["Week 2","What is differentiation?","Growth of specialized sub-units in the system. E.g. purchasing, quality, finance units in a company."],
["Week 2","What is equifinality?","The same end state can be reached by different paths. E.g. getting material through the formal route or via informal approval."],
["Week 2","List the 13 system precepts.","1 Holism 2 Organicism 3 Synthesis (thesis + antithesis) 4 Variety 5 Emergence 6 System (system of systems) 7 Homeostasis 8 Viability 9 Purpose 10 Behavior 11 Isomorphs 12 Ideals (the ideal system) 13 Values"],
["Week 2","What is emergence?","A property or behaviour that none of the parts has, appearing only in the whole. E.g. traffic jams, team spirit, delay that forms in the arrows between boxes."],
["Week 2","Machine Age approach?","ANALYSIS: decompose the whole into parts → explain the behaviour/properties of each part → aggregate the explanations.\nQuestion: HOW does it work? Accumulates descriptions. Limit: parts do not explain the whole."],
["Week 2","Systems Age approach?","SYNTHESIS: identify the surrounding environment (the containing whole) → find the system's MISSION within it → explain the system's behaviour/properties from that role.\nQuestion: WHY does it exist? Synthesis yields knowledge."],
["Week 2","Machine vs Systems Age in one sentence?","The Machine Age answers 'how does it work' by taking the system apart; the Systems Age answers 'why does it exist' by looking at its environment and mission. Reductionism vs holism/synthesis."],
["Week 2","Why look at system behaviours?","With behaviours we find validation of the system, and verification (productivity analysis, reliability analysis) can be done."],
// WEEK 3
["Week 3","Aristotle's composition law (Hall, 1989)?","The whole is more than the sum of its parts; the part is more than a fraction of the whole."],
["Week 3","Stages of the system life cycle?","1 Management\n2 Design and development\n3 Production and/or construction\n4 Operational use and maintenance support\n5 Retirement and material disposal\nKey question: 'What is next?'"],
["Week 3","How does the collapse (implosion) loop work?","Positive feedback loop: dispersive influences → system cohesion falls → decay/breakdown → variety generation → more dispersive influences.\nExample: USSR, once one country broke away it joined the dispersive influences (domino). Hitchins: constant battle between cohesion and dispersion."],
["Week 3","What is concurrent engineering?","Replaces the linear sequence with cross-functional integration: design, production, quality and procurement evaluate changes together from the start. Front-loading: problems are solved early in design. Result: faster implementation, fewer revision errors, less rework."],
["Week 3","The 5-layer system model?","L1 Product/subsystem SE\nL2 Project SE\nL3 Business SE\nL4 Industrial SE (supply chain)\nL5 Socio-economic SE\nWealth chain: national → industrial → corporate → individual wealth creation. Government policy, legal and political influences sit on top."],
["Week 3","Layer 1 paradigm?","Creating an innovative artifact/product: a problem in the problem space → a proven solution in the solution space. The solution is PROVEN by its ability to neutralize the symptoms of the problem."],
["Week 3","Flows in Layer 4?","Product flows left to right (supplier → customer); demand flows right to left. Two tiered businesses, each with its own project SE capability."],
["Week 3","Layer 5 example?","Ancient Egypt, Old Kingdom: a highly successful economy without money and without manufacture of utilitarian goods. Policy, law, taxes and standards belong here."],
["Week 3","5-layer example: automobile production","L5 emission standards, taxes, transport policy\nL4 automotive industry, suppliers, dealer network\nL3 car company (strategy, finance, quality)\nL2 new-model development project\nL1 vehicle, engine, gearbox, electronics"],
["Week 3","5-layer example: ECM","L1 product components, drawings, BOM\nL2 planning ECR→ECO, team coordination\nL3 change cost and business objectives\nL4 effects on suppliers and manufacturing network\nL5 legal and safety regulations"],
["Week 3","5-layer operation: how do layers interact?","Upper layers constrain lower ones (policy → industry → company → project → product). Lower layers feed the upper ones (product success → company revenue → national wealth). In L1 the solution is proven by neutralizing symptoms; in L4 product and demand flow in opposite directions."],
// WEEK 4
["Week 4","What is a systems methodology?","The body of methods, rules and postulates used by systems practitioners to investigate, understand and address systems, their issues, problems, behaviors and contexts and, where appropriate, to solve, resolve or dissolve problems. It is the 'how' of systems engineering."],
["Week 4","Why is the systems methodology a paradigm?","To be a universal problem solver it must be independent of problem type and context; it is 'a way of doing things', a pattern that forms the basis of the methodology, i.e. a paradigm."],
["Week 4","The 9 dimensions of the systems methodology?","Scientific; logic and epistemological; time; cultural/political/behavioral; moral and ethical; social; organizational; economic; technological."],
["Week 4","Combined problem-solving paradigm?","General problem-solving paradigm + systems engineering problem-solving paradigm. It aims to solve problems rather than resolve or dissolve them.\nFlow: symptoms → understand problem → ideal criteria → choose best option → try it → symptoms gone? yes = proven, no = back to the problem."],
// FFBD
["FFBD","What is an FFBD?","Functional Flow Block Diagram: shows a system's functions, their sequence and logical relationships. Functional decomposition splits main functions into subfunctions at different levels."],
["FFBD","Block notation rule?","Rectangle, number at top left (1.0, 2.3, 1.3.3.1), text inside is VERB + OBJECT ('Check budget', 'Send PO')."],
["FFBD","What is a reference (Ref.) block?","Brackets [ Ref. ... ]. A lower-level diagram starts with a Ref. block and ends with the Ref. of the next block."],
["FFBD","AND vs OR vs Go / No-Go?","AND: parallel, all are done. OR: alternatives, one is done. G (Go): proceed. G-bar (No-Go): alternative path or feedback loop; the arrow leaves downward."],
["FFBD","How are levels linked in the drawing?","A dashed line from the upper-level block down to the lower level, with '~' under the expanded block."],
["FFBD","Cafe Bistro, Level 1?","1.0 Enter cafe → 2.0 Sit at table → 3.0 Place order → 4.0 Consume food/drink → 5.0 Pay bill → 6.0 Leave cafe."],
["FFBD","Cafe Level 2: blocks 4.0 and 5.0?","4.0: (AND) eat food + drink beverage → (OR) finish food / finish beverage → request bill.\n5.0: check bill → pay → (OR) cash / credit card → get receipt."],
["FFBD","ECM FFBD Level 1 (7 blocks)?","1.0 Receive ECR → 2.0 Review and register ECR → 3.0 Evaluate change → 4.0 Make approval decision → 5.0 Prepare and release ECO → 6.0 Implement change → 7.0 Verify and close change.\nIn 5.0, AND: update drawings + update BOM."],
["FFBD","Procurement FFBD Level 1 (8 blocks)?","1.0 Identify need and create PR → 2.0 Approve PR (No-Go 2.4 no budget) → 3.0 Request quotations → 4.0 Evaluate quotes and select supplier → 5.0 Issue PO and follow up → 6.0 Receive goods → 7.0 Inspect quality → 8.0 Accept delivery and close PR."],
["FFBD","Exam drawing strategy?","1) Level 1: 5–8 blocks left to right, verb+object, numbered 1.0, 2.0…\n2) Expand one block: start/end with Ref. blocks, add AND/OR\n3) Level 3 if needed (1.3.1, 1.3.2…)\n4) Add a Go/No-Go\n5) Dashed lines between levels."],
// MACHINE / SYSTEMS
["Machine vs Systems analysis","How do I write 'analyze with the Machine Age approach'?","1) Decompose the system into parts\n2) Explain the behaviour/properties of each part separately\n3) Aggregate the explanations and assume they explain the whole\n4) Question: HOW does it work?\n5) State the limit: interactions and emergence are missed, sub-optimization."],
["Machine vs Systems analysis","How do I write 'analyze with the Systems Age approach'?","1) Identify the surrounding environment (the larger whole)\n2) Find the system's MISSION/role within it\n3) Explain its behaviour/properties from that role\n4) Question: WHY does it exist?\n5) Conclusion: synthesis yields knowledge."],
["Machine vs Systems analysis","Example: a UNIVERSITY, Machine Age approach","1) Parts: faculties, departments, classrooms, library, students, staff, budget\n2) Explain each separately: curriculum, library collection, classroom capacity\n3) Aggregate: if the parts work well, the university is good\nLimit: gaps between departments and graduates' fit to society are invisible."],
["Machine vs Systems analysis","Example: a UNIVERSITY, Systems Age approach","1) Environment: government/higher-education policy, industry, society, other universities, labour market\n2) Mission: produce qualified people and knowledge (R&D), benefit society\n3) Explain curriculum, quotas, library, budget by how they serve this mission\nResult: 'why' is answered through the environment; improvement starts from the relationships."],
["Machine vs Systems analysis","Example: a HOSPITAL with both approaches (short)","Machine: separate emergency, surgery, lab, pharmacy; measure each one's capacity and performance; add up.\nSystems: environment (health policy, population, insurance, ambulances, other hospitals), mission (protect public health) → judge units by the mission and the flows between them (patient path, delays)."],
["Machine vs Systems analysis","Example: ECM / procurement with both approaches","Machine: examine boxes one by one (quality approves, finance pays, goods receipt counts); each box works.\nSystems: environment (suppliers, regulations, customers), mission (right material/change on time); the delay forms in the ARROWS (documents waiting for approval, PRs sent back). The fix is in the relationships."],
["Machine vs Systems analysis","Comparison table: Machine vs Systems Age","Method: analysis/decomposition ↔ synthesis\nQuestion: how ↔ why\nView: part→whole ↔ whole→part (environment and mission)\nKnowledge: accumulates descriptions ↔ synthesis yields knowledge\nPrinciple: reductionism ↔ holism, emergence, synthesis\nLimit: misses emergence ↔ manages complexity."],
["Machine vs Systems analysis","Template for writing both approaches in an exam","1) Define the system (boundary, environment, purpose)\n2) Machine Age: decompose → explain → aggregate → limit\n3) Systems Age: environment → mission → behaviour → synthesis\n4) Difference sentence: machine = 'how', systems = 'why'\n5) Conclusion: for complex systems the systems approach is needed because the parts do not explain the whole."],
// VIDEOS
["Video 1 (TR): paradigm","What is a paradigm ('değer sayım')?","The way of acting/seeing formed by the education and information a person has received since birth. The instructor's Turkish coinage: 'değer sayım' (value + assumption). Every problem is a product of a paradigm; change the paradigm and the problem and its solution change."],
["Video 1 (TR): paradigm","What is the most important gain of a paradigm?","Growth of the solution set. Do not fear the differentiation of problems. Changing a paradigm is hard and meets resistance; big systems fall to small questions."],
["Video 1 (TR): paradigm","Money-system questioning: Test 1?","The central bank lends money at interest: lent P, asked back P(1+i). Where does the interest money come from? The mechanism fails at the starting point."],
["Video 1 (TR): paradigm","Money system: quantity-balance test?","Base money about 650 billion TL vs total credit about 14.5 trillion TL. The difference is created by fractional reserve banking and the money multiplier; geometric series sum S = a(1−qⁿ)/(1−q)."],
["Video 1 (TR): paradigm","Assets = Liabilities and 'money = debt'?","Deposits + Capital = Credit + Cash. Time derivative: dM/dt + dS/dt = dK/dt + dN/dt. Capital and cash constant → dM/dt = dK/dt → money = debt."],
["Video 2 (Collins)","Origin of 'engineer' and the INCOSE SE definition?","Latin ingeniare (ingenious person); first holder of the title: Leonardo da Vinci. Systems engineering: an interdisciplinary approach enabling the realization of successful, purposeful, sustainable systems."],
["Video 2 (Collins)","Collins' 3 case studies and lessons?","Thameslink (£3.5bn): success depends on passenger behaviour; the model was outdated.\nBiofuels: the same crop emits very different carbon depending on region → uncertain science = unsustainable policy.\nIcelandic volcanic ash: regulation said 'don't fly through visible ash' but fine silicate ash is invisible; 5 days, expert networks, Government Chief Scientific Adviser."],
["Video 2 (Collins)","Collins' conclusions?","Co-evolution of solutions and problems, embedded learning, governance, standards plus innovation, political capital is part of the system, competition and collaboration coexist, a plan is a means not an end."],
["Video 3 (Ottino)","Ottino's toolbox?","Agent-based modeling (NetLogo: termites, flocks, ants), network theory (ecological webs, internet, air transport), statistical mechanics/econophysics, simulation. Message: engineers should include these in the standard toolkit."],
["Video 3 (Ottino)","Emergence example and Schelling?","Schelling's segregation model: simple individual rules produce complex collective behaviour; inferring individual intent from group phenomena is hard. Termite piles, bird flocks: no central commander."],
["Video 3 (Ottino)","The shared-vocabulary idea?","Complexity can be a shared vocabulary for medicine, law, engineering, business to communicate; it creates new disciplines. Anderson 1972: 'More is different'."],
// PAPERS
["Papers (GRT)","GRT state model: 4 layers, multipliers, staff share?","1L core government: multiplier 1, 1.562%\n2L security: 3, 4.687%\n3L R&D: 12, 18.75%\n4L production: 48, 75%\n(2N+1) geometric sequence, like the golden ratio with 3.39% error."],
["Papers (GRT)","2050 higher-education paper summary?","Model-Based Engineering in 3 parts: problem identification → modeling → solution. Target 80% success in 35 years, 100% in 45–50. 10 regions, 7 priority fields, 14 technology transformation institutes, 7 technology development centres, work with regional universities."],
["Papers (GRT)","Three basic engineering design methods (2019 paper)?","Model-Based Engineering (MBE), Component-Based Engineering (CBE), Software-Based Engineering (SBE). MBE is the broadest."],
// HOMEWORK
["Homework template","The 10-section system analysis template (HW1)?","1 Introduction (boundary, environment) 2 Systems philosophy 3 Paradigm and solution space 4 Problem nature and entropy 5 Open system 1–5 6 Open system 6–9 7 Precepts 1–7 8 Precepts 8–13 + Machine/Systems Age 9 Life cycle 10 5 layers, methodology, conclusion."],
["Homework template","Answer pattern for 'analyze this with approach X'?","System definition → boundary and environment → steps of the requested approach (Machine/Systems Age, 9 characteristics, 13 precepts, 5 layers, life cycle, 9 dimensions, paradigm, FFBD) → example or diagram → conclusion: relationships, not parts, matter."],
["Homework template","ECM collapse risk example?","When departments act independently, variety rises and dispersive influences grow; chaos → errors → blame → the process collapses like dominoes (positive feedback). Proof of the solution: the symptoms are fully neutralized."]
];
const KEY="ie471_cards_en_v1";
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const ALL="All topics";
const cats=[ALL,...new Set(C.map(c=>c[0]))];
const $=id=>document.getElementById(id);
cats.forEach(c=>{const o=document.createElement("option");o.textContent=c;$("cat").appendChild(o)});
let deck=[],i=0;
function build(){
 const cat=$("cat").value,mode=$("mode").value;
 deck=C.map((c,idx)=>({c,idx})).filter(x=>(cat===ALL||x.c[0]===cat)&&(mode==="all"||st[x.idx]!=="ok"));
 i=0;render();
}
function render(){
 $("card").classList.remove("flip");
 if(!deck.length){$("q").textContent="No cards in this filter. Well done!";$("a").textContent="";$("tagF").textContent="";$("tagB").textContent="";stat();return}
 const {c}=deck[i];
 $("tagF").textContent=c[0]+" • "+(i+1)+"/"+deck.length;$("tagB").textContent=c[0];
 $("q").textContent=c[1];$("a").textContent=c[2];stat();
}
function stat(){$("stat").textContent="Known: "+C.filter((_,k)=>st[k]==="ok").length+"/"+C.length}
function go(d){if(!deck.length)return;i=(i+d+deck.length)%deck.length;render()}
function mark(v){if(!deck.length)return;st[deck[i].idx]=v;save();if($("mode").value==="unk"&&v==="ok"){deck.splice(i,1);if(i>=deck.length)i=0;render()}else go(1)}
$("card").onclick=()=>$("card").classList.toggle("flip");
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("good").onclick=()=>mark("ok");$("bad").onclick=()=>mark("no");
$("cat").onchange=build;$("mode").onchange=build;
$("shuf").onclick=()=>{for(let k=deck.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[deck[k],deck[j]]=[deck[j],deck[k]]}i=0;render()};
$("reset").onclick=()=>{st={};save();build()};
document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();$("card").classList.toggle("flip")}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)});
build();
</script>
