<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IE471 Mock Exam</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a65;--acc:#2f5fd0;--ok:#1f8a4c;--no:#c0392b;--line:#dcdad2;--soft:#eef2fc}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#222221;--ink:#eeede8;--mut:#a09f98;--acc:#7da2ff;--ok:#4cc27d;--no:#ef7a6d;--line:#3a3a38;--soft:#1f2636}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,Segoe UI,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mut);margin-bottom:14px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700}
.timer.low{color:var(--no)}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.spacer{flex:1}
.score{font-weight:700}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.q h2{font-size:17px;margin:0 0 6px}
.pts{color:var(--acc);font-size:13px;font-weight:600}
.q ul{margin:6px 0 10px 20px;padding:0}
textarea{width:100%;min-height:110px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.ans{display:none;margin-top:10px;background:var(--soft);border-left:4px solid var(--acc);border-radius:8px;padding:12px 14px;white-space:pre-wrap;font-size:15px}
.ans.show{display:block}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
input[type=number]{width:80px;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.res{display:none;background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:16px;margin:14px 0;font-size:17px}
.res.show{display:block}
pre{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:13px;margin:0}
.q{scroll-margin-top:84px}
</style>
</head>
<body>
<div class="wrap">
<h1>IE471 Systems Engineering — Mock Exam</h1>
<div class="sub">90 minutes · 100 points (+5 bonus). Write your answers first, then reveal the model answer and score yourself.</div>

<div class="top">
<span class="timer" id="timer">90:00</span>
<button class="p" id="start">Start timer</button>
<button id="pause">Pause</button>
<span class="spacer"></span>
<span class="score" id="score">Score: 0 / 100</span>
</div>

<div id="qs"></div>

<div class="res" id="res"></div>
<div class="row"><button class="p" id="finish">Finish and show result</button><button id="clear">Clear everything</button></div>
</div>

<script>
/* IE471 shared animated diagram library. Usage: DG.mount(element, presetName, autoplay) */
(function(){
if(window.DG)return;
const css=`
:root{--c0:rgba(47,95,208,.16);--c1:rgba(31,138,76,.16);--c2:rgba(214,140,20,.18);--c3:rgba(142,68,173,.16);--c4:rgba(192,57,43,.14)}
@media (prefers-color-scheme:dark){:root{--c0:rgba(125,162,255,.22);--c1:rgba(76,194,125,.2);--c2:rgba(240,170,60,.22);--c3:rgba(190,120,230,.22);--c4:rgba(239,122,109,.2)}}
.dgc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:12px;overflow-x:auto;color:var(--ink)}
.dgt{font-weight:700;margin:2px 4px 6px;font-size:15px}
.dgb{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.dgb button{font:inherit;font-size:14px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.dgn{color:var(--mut);font-size:13px;margin-left:auto}
.dgcap{background:var(--soft);border-left:4px solid var(--acc);border-radius:8px;padding:8px 12px;min-height:44px;font-size:14px;white-space:normal}
.dgc svg.dg{width:100%;min-width:760px;height:auto;display:block}
.dgc svg.dg text{fill:var(--ink);font-size:12.5px;font-family:system-ui,Segoe UI,sans-serif}
.dgc svg.dg .nm{font-size:10px;fill:var(--acc);font-weight:700}
.dgc svg.dg .gl{font-weight:700;fill:var(--acc);font-size:12px}
.dgc svg.dg .lv{font-weight:700;fill:var(--mut);font-size:13px}
.dgc svg.dg .big{font-size:15px;font-weight:700}
.dgc svg.dg .red{fill:var(--no);font-weight:700}
.dgc svg.dg .bx{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.dgc svg.dg .ref{fill:none;stroke:var(--acc);stroke-width:1.5;stroke-dasharray:3 3}
.dgc svg.dg .ar{stroke:var(--ink);stroke-width:1.6;fill:none}
.dgc svg.dg .lk{stroke:var(--acc);stroke-width:1.4;stroke-dasharray:5 4;fill:none}
.dgc svg.dg .flow{stroke-dasharray:7 5;animation:dgdash 1s linear infinite}
@keyframes dgdash{to{stroke-dashoffset:-12}}
.dgc svg.dg .env{fill:none;stroke:var(--mut);stroke-width:1.5;stroke-dasharray:8 5}
.dgc svg.dg .sysb{fill:var(--soft);stroke:var(--acc);stroke-width:2}
.dgc svg.dg .bd{fill:var(--acc)}
.dgc svg.dg .bdt{fill:#fff;font-weight:700;font-size:12px}
.dgc svg.dg .lay{stroke:var(--ink);stroke-width:1.5}
.dgc svg.dg .lay0{fill:var(--c0)}.dgc svg.dg .lay1{fill:var(--c1)}.dgc svg.dg .lay2{fill:var(--c2)}.dgc svg.dg .lay3{fill:var(--c3)}.dgc svg.dg .lay4{fill:var(--c4)}
.dgc .st{opacity:0;transition:opacity .6s}
.dgc .st.on{opacity:1}
.dgc .st.cur .bx,.dgc .st.cur .lay,.dgc .st.cur .sysb{stroke:var(--acc);stroke-width:2.6}
.dgc svg.dg .dom{fill:var(--c4);stroke:var(--no);stroke-width:1.5;transform-box:fill-box;transform-origin:100% 100%;transition:transform .5s}
.dgc svg.dg.s5 .dom{transform:rotate(70deg)}
.dgc svg.dg .decay{fill:var(--no);opacity:.75;transform-box:fill-box;transform-origin:50% 100%;transition:transform 3s}
.dgc svg.dg.s2 .decay{transform:scaleY(.12)}
.dgc svg.dg .hold{fill:var(--ok);opacity:.75}
.dgc svg.dg .meter{fill:none;stroke:var(--ink);stroke-width:1.5}
`;
const stl=document.createElement('style');stl.textContent=css;document.head.appendChild(stl);
const dh=document.createElement('div');
dh.innerHTML='<svg width="0" height="0" style="position:absolute"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker></defs></svg>';
(document.body||document.documentElement).appendChild(dh);

const E=s=>String(s).replace(/&(?!amp;)/g,'&amp;');
const T=(x,y,t,c='',a='middle')=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">${E(t)}</text>`;
const G=(n,i)=>`<g class="st" data-s="${n}">${i}</g>`;
const A=(x1,y1,x2,y2,c='')=>`<line class="ar ${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#ah)"/>`;
const P=(d,c='')=>`<path class="ar ${c}" d="${d}" marker-end="url(#ah)"/>`;
const LK=(x1,y1,x2,y2)=>`<line class="lk" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const Bd=(x,y,n)=>`<circle class="bd" cx="${x}" cy="${y}" r="11"/><text class="bdt" x="${x}" y="${y+4}" text-anchor="middle">${n}</text>`;
function B(x,y,w,h,num,txt,cls=''){const ls=txt.split('|'),n=ls.length;let s=`<rect class="bx ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>`;if(num)s+=`<text class="nm" x="${x+5}" y="${y+12}">${num}</text>`;ls.forEach((l,i)=>{s+=`<text x="${x+w/2}" y="${y+h/2+(i-(n-1)/2)*14+(num?6:4)}" text-anchor="middle">${E(l)}</text>`});return s}
function R(x,y,w,h,txt){return `<rect class="ref" x="${x}" y="${y}" width="${w}" height="${h}"/><text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" style="fill:var(--acc)">[ ${E(txt)} ]</text>`}
const SV=(vb,inner)=>`<svg class="dg" viewBox="${vb}">${inner}</svg>`;
const plain=s=>s.replace(/\|/g,' ');

/* ---------- generic FFBD ---------- */
function ffbd(sp){
 const l1=sp.l1,x0=20,pitch=140,W=110;
 const steps=['Press Play: the diagram is built level by level.'];
 let out=[];
 let s1=T(20,22,'LEVEL 1 — operational flow','lv','start');
 l1.forEach((t,i)=>{const x=20+i*136;s1+=B(x,36,112,54,(i+1)+'.0',t);if(i<l1.length-1)s1+=A(x+112,63,x+136,63)});
 out.push(G(1,s1));steps.push('Level 1: '+l1.length+' blocks, verb + object, numbered 1.0–'+l1.length+'.0, flowing left to right.');
 let step=2,Y=128,last=null;
 function lvl2(b,Y,tag){
  const k=b.i+1,items=b.items,n=items.length;
  const hasG=items.some(it=>typeof it!=='string');
  const yc=Y+(hasG?72:40);
  let svg=T(20,Y,`LEVEL 2 — block ${k}.0 ${plain(l1[b.i])}${b.sfx?' ('+b.sfx+')':''}`,'lv','start');
  let num=0;const nxt=()=>k+'.'+(++num);
  const xs=j=>x0+(j+1)*pitch;const col=[];
  svg+=R(x0,yc-25,W,50,b.ref[0]);
  let prev=[{x:x0+W,y:yc}];
  items.forEach((it,j)=>{
   const x=xs(j);let ins;
   if(typeof it==='string'){const id=nxt();svg+=B(x,yc-23,W,46,id,it);ins=[yc];col[j]={outs:[yc],box:{x,y:yc-23,id}}}
   else{const kind=it.and?'AND':'OR',arr=it.and||it.or,ys=[yc-35,yc+35],boxes=[];arr.forEach((t,m)=>{const id=nxt();svg+=B(x,ys[m]-23,W,46,id,t);boxes.push({x,y:ys[m]-23,id})});ins=ys;col[j]={outs:ys,boxes};svg+=T(x-17,yc+4,kind,'gl')}
   if(prev.length===ins.length&&prev.length>1)prev.forEach((p,m)=>{svg+=A(p.x,p.y,x,ins[m])});
   else prev.forEach(p=>ins.forEach(iy=>{svg+=A(p.x,p.y,x,iy)}));
   prev=col[j].outs.map(oy=>({x:x+W,y:oy}));
  });
  const xo=xs(n);svg+=R(xo,yc-25,W,50,b.ref[1]);prev.forEach(p=>{svg+=A(p.x,p.y,xo,yc)});
  let bottom=yc+(hasG?62:28);
  if(b.gate){
   const g=b.gate,d=col[g.at].box,xd=d.x;
   svg+=T(xd+W+15,yc-8,g.g||'Go','gl');
   if(g.rej){svg+=A(xd+55,yc+23,xd+55,yc+60)+T(xd+65,yc+46,g.ng,'gl','start')+B(xd,yc+60,W,44,nxt(),g.rej);bottom=yc+110}
   else{svg+=A(xd+55,yc+23,xd+20,yc+70)+A(xd+55,yc+23,xd+140,yc+70)+T(xd+124,yc+42,g.ng,'gl','start')+B(xd-35,yc+70,W,46,nxt(),g.alt[0])+B(xd+85,yc+70,W,46,nxt(),g.alt[1])+T(xd+80,yc+134,'OR  ·  ↩ back to '+col[g.back].box.id,'gl');bottom=yc+140}
  }
  if(b.loop){
   const l=b.loop,d=col[l.at].box,xd=d.x,tg=col[l.to].boxes[l.sub],tcx=tg.x+55;
   svg+=A(xd+55,yc+23,xd+55,yc+70)+T(xd+65,yc+52,l.label,'gl','start')+B(xd,yc+70,W,46,nxt(),l.box)+P(`M${xd},${yc+93} L${tcx},${yc+93} L${tcx},${tg.y+46}`,'flow')+T((xd+tcx)/2,yc+86,l.lbl||'loop back','gl');
   bottom=yc+120;
  }
  const H=bottom-Y+12;
  return{svg,H,col,yc};
 }
 function caption(b){const it=b.items,hasAnd=it.some(x=>x.and),hasOr=it.some(x=>x.or);
  return b.cap||(`Level 2 of ${b.i+1}.0: starts with ${b.ref[0]} and ends with ${b.ref[1]}.`+(hasAnd?' AND = parallel functions, all are done.':'')+(hasOr?' OR = alternatives, only one is done.':'')+(b.gate?' Go/No-Go at the decision: Go continues, No-Go leads to the alternative path.':'')+(b.loop?' The loop returns defective goods and re-inspects.':'')+' Dashed line + “~” link the levels.')}
 function link(i,Yb,first){const xc=20+i*136+56;if(first)return LK(xc,90,xc,Yb-16)+T(xc+10,104,'~','lv','start');return `<path class="lk" d="M${xc},90 V110 H952 V${Yb-16}"/>`+T(xc+10,104,'~','lv','start')}
 const blocks=[sp.a,sp.b].filter(Boolean);let first=true;
 blocks.forEach(b=>{
  const r=lvl2(b,Y,'');out.push(G(step,link(b.i,Y,first)+r.svg));steps.push(caption(b));
  last={b,r,Y};Y+=r.H+22;step++;first=false;
 });
 if(sp.c){
  const c=sp.c,r=last.r,col=r.col[c.item];const bx=col.boxes?col.boxes[c.sub]:col.box;
  const cx=bx.x+12,cy=bx.y+46;
  const Yc=Y;let svg=LK(cx,cy,cx,Yc-16)+T(cx+8,cy+14,'~','lv','start');
  svg+=T(20,Yc,`LEVEL 3 — block ${c.num} ${c.name}`,'lv','start');
  const yy=Yc+14,n=c.items.length;
  svg+=R(x0,yy,W,46,c.ref[0]);
  let px=x0+W;
  c.items.forEach((t,j)=>{const x=x0+(j+1)*pitch;svg+=A(px,yy+23,x,yy+23)+B(x,yy,W,46,c.num+'.'+(j+1),t);px=x+W});
  const xo=x0+(n+1)*pitch;svg+=A(px,yy+23,xo,yy+23)+R(xo,yy,W,46,c.ref[1]);
  out.push(G(step,svg));steps.push(c.cap||`Level 3 of ${c.num}: further decomposition; same Ref. start/end rule and dashed link.`);
  Y=Yc+76;
 }
 return{svg:SV(`0 0 960 ${Y+6}`,out.join('')),steps};
}

/* ---------- 5 layers ---------- */
function layers(p){
 let s='';
 p.rows.forEach((l,i)=>{const y=20+i*84;s+=G(i+1,`<rect class="lay lay${i}" x="230" y="${y}" width="500" height="68" rx="8"/>`+T(250,y+28,l[0],'big','start')+T(250,y+52,l[1],'','start'))});
 s+=G(6,A(190,30,190,414)+T(190,16,'constrains ↓','gl')+T(190,436,'policy → product','gl'));
 s+=G(7,A(770,414,770,30)+T(770,16,'feeds ↑','gl')+T(770,436,'value → wealth','gl'));
 s+=G(8,`<rect class="bx" x="790" y="104" width="160" height="68" rx="8"/>`+T(870,128,'product → customer')+T(870,148,'← demand flows back')+T(480,462,'Wealth chain: national → industrial → corporate → individual','big'));
 const nm=p.rows.map(r=>r[0]);
 return{svg:SV('0 0 960 480',s),steps:['Press Play: the five-layer model of '+p.name+'.',nm[0]+': policy, law, funding and rules shape everything below.',nm[1]+': the industry and its supply chain.',nm[2]+': the organization as a business.',nm[3]+': a specific project.',nm[4]+': the product itself (a solution here is proven by neutralizing the symptoms).','Upper layers constrain lower layers: policy → industry → company → project → product specification.','Lower layers feed upper layers: product success → company revenue → industrial and national wealth.','In L4 product flows supplier → customer while demand flows back. Wealth chain: national → industrial → corporate → individual.']};
}

/* ---------- machine vs systems ---------- */
function ms(p){
 const n=p.parts.length,gap=n>1?(440-n*80)/(n-1):0;
 let a=T(230,16,'MACHINE AGE — analysis','lv')+B(160,28,140,44,'',p.sys),b='',c='';
 p.parts.forEach((t,i)=>{const x=15+i*(80+gap);b+=A(230,72,x+40,130)+B(x,130,80,40,'',t);c+=T(x+40,190,'✓ explain','gl')});
 const d=A(230,200,230,248)+B(140,250,180,50,'','Σ parts = whole ?')+T(230,330,'HOW does it work?','big')+T(230,356,'misses interactions → sub-optimization','red');
 const e=T(730,16,'SYSTEMS AGE — synthesis','lv')+`<ellipse class="env" cx="730" cy="200" rx="220" ry="150"/>`+T(730,92,p.env[0])+T(730,108,p.env[1]);
 const f=T(730,140,p.mission,'gl');
 const g=B(660,170,140,60,'',p.sys)+A(520,200,660,200,'flow')+A(800,200,945,200,'flow')+T(590,190,'flows in')+T(730,290,'WHY does it exist?','big')+T(730,314,'behaviour judged by mission + flows');
 return{svg:SV('0 0 960 380',G(1,a+b)+G(2,c)+G(3,d)+G(4,e)+G(5,f)+G(6,g)),steps:['Press Play: the same system ('+p.sys.toLowerCase()+') analysed with both approaches.','Machine Age step 1: decompose the whole into parts.','Machine Age step 2: explain each part separately.','Machine Age step 3: aggregate the explanations. Question asked: HOW does it work? Limit: interactions are missed.','Systems Age step 1: identify the surrounding environment (the containing whole).','Systems Age step 2: find the system\'s mission within that environment.','Systems Age step 3: explain behaviour from that role. Question asked: WHY does it exist? Synthesis yields knowledge.']};
}

/* ---------- collapse loop ---------- */
function collapse(){
 let s=G(1,B(235,48,130,44,'','Dispersive|influences'));
 s+=G(2,P('M365,70 Q460,70 460,186','flow')+B(395,188,130,44,'','Cohesion|falls'));
 s+=G(3,P('M460,232 Q460,350 365,350','flow')+B(235,328,130,44,'','Decay /|breakdown'));
 s+=G(4,P('M235,350 Q140,350 140,232','flow')+B(75,188,130,44,'','Variety|generation')+P('M140,188 Q140,70 235,70','flow')+T(300,210,'positive','gl')+T(300,226,'feedback loop','gl'));
 let dom='';for(let i=0;i<6;i++)dom+=`<rect class="dom" x="${620+i*42}" y="250" width="26" height="60" style="transition-delay:${i*0.25}s"/>`;
 s+=G(5,dom+T(745,335,'USSR: one breaks away → domino fall','gl'));
 s+=G(6,`<rect class="bx" x="610" y="50" width="280" height="86" rx="8"/>`+T(750,74,'Concurrent engineering','big')+T(750,96,'design · production · quality · procurement')+T(750,114,'together from day 1 (front-loading)')+P('M610,100 L180,112')+T(150,126,'✕','red big')+T(745,176,'cohesion kept: fewer revisions, less rework','gl'));
 return{svg:SV('0 0 920 400',s),steps:['Press Play: the positive feedback loop that collapses complex systems.','Dispersive influences appear (e.g. one republic breaks away from the USSR).','System cohesion falls.','Decay / breakdown follows.','Variety generation feeds more dispersive influences: a self-reinforcing positive feedback loop.','The domino fall (USSR example).','Concurrent engineering breaks the loop: all functions work together from the start, problems are solved in design (front-loading).']};
}

/* ---------- open system ---------- */
function open9(ex){
 let s=`<rect class="env" x="10" y="10" width="940" height="440" rx="14"/>`+T(30,36,'ENVIRONMENT','lv','start')+`<rect class="sysb" x="300" y="100" width="360" height="250" rx="12"/>`+T(480,122,'SYSTEM (boundary)','lv');
 s+=`<rect class="bx" x="330" y="150" width="300" height="90" rx="8"/>`;
 s+=G(1,A(70,210,330,210,'flow')+T(190,196,'energy · matter · money','gl')+Bd(64,188,1));
 s+=G(2,T(480,170,'Throughput: transform inputs','big')+Bd(330,150,2));
 s+=G(3,A(630,210,900,210,'flow')+T(765,196,'products · services · waste','gl')+Bd(880,190,3));
 s+=G(4,P('M880,215 C880,50 100,50 100,205','flow')+T(480,78,'output feeds new input','gl')+Bd(480,90,4));
 s+=G(5,A(610,440,570,352,'flow')+T(620,436,'new order imported','gl','start')+Bd(590,395,5));
 s+=G(6,A(330,440,380,352,'flow')+T(320,436,'information input','gl','end')+P('M610,250 Q480,305 350,250','flow')+T(480,300,'negative feedback','gl')+Bd(420,285,6));
 s+=G(7,T(480,338,'steady state: balance kept','gl')+Bd(375,334,7));
 s+=G(8,B(345,182,85,44,'','Unit A')+B(440,182,85,44,'','Unit B')+B(535,182,85,44,'','Unit C')+Bd(335,232,8));
 s+=G(9,A(70,265,330,232,'flow')+T(110,288,'different paths, same result','gl','start')+Bd(90,246,9));
 return{svg:SV('0 0 960 460',s),steps:['Press Play: the nine characteristics of an open system'+(ex.name?' ('+ex.name+')':'')+'.','1 Importation of energy: '+ex.in,'2 Throughput: '+ex.thr,'3 Output: '+ex.out,'4 Cycles of events: '+ex.cyc,'5 Negative entropy: '+ex.neg,'6 Information input and negative feedback: '+ex.fb,'7 Steady state and dynamic homeostasis: '+ex.hom,'8 Differentiation: '+ex.dif,'9 Equifinality: '+ex.eq]};
}

/* ---------- GRT ---------- */
function grt(){
 const L=[['1L Core government','×1','1.562%',190,1.562],['2L Security','×3','4.687%',300,4.687],['3L R&D','×12','18.75%',400,18.75],['4L Production','×48','75%',500,75]];

{id:"q1",t:"Q1 — Definitions",pts:20,body:`<ul><li>a) What is a system? (4)</li><li>b) What is an open system? (4)</li><li>c) What is a closed system? (4)</li><li>d) What are the inputs of a system? Give examples. (4)</li><li>e) Differentiate between a complex system and a complicated system. (4)</li></ul>`,
a:`a) System: a set of interrelated components inside a boundary, interacting with its environment for a common purpose, showing emergent behaviour that none of the parts shows alone (the whole is more than the sum of its parts). We recognize a system by its behaviour; there is no generic SE model.

b) Open system: exchanges energy, matter and information with its environment; imports inputs, transforms them (throughput), exports outputs; survives through negative entropy; has feedback, homeostasis, equifinality. E.g. a company.

c) Closed system: no exchange with the environment; no incoming order, so entropy increases (2nd law) and it runs down to equilibrium. E.g. an insulated thermos (idealized).

d) Inputs: energy, matter, information (plus people, money, demand) taken from the environment. Factory: raw material, electricity, orders. ECM: ECRs, complaints. Procurement: PRs, budget.

e) Complex: simple parts, rich unpredictable collective behaviour, order emerges without a central organizer (fish school, market). Complicated: many parts, each with a strictly defined function (Boeing, watch).`},
{id:"q2",t:"Q2 — Entropy",pts:10,body:`Define entropy and negative entropy. Give one example of each from a company or university. What happens to a system without negative entropy?`,
a:`Entropy: measure of disorder; in a closed system it increases (2nd law of thermodynamics). (3)
Negative entropy: order imported from the environment (energy, information, resources) that offsets entropy and keeps an open system alive. (3)
Examples (2): Company: entropy = messy processes, incomplete forms, lost motivation; negative entropy = new orders, investment, training. University: entropy = outdated curriculum; negative entropy = new students, R&D funding, new faculty.
Without negative entropy the system stops/decays. (2)`},
{id:"q3",t:"Q3 — Five layers",pts:20,body:`Choose a system of your own (not a car). Build the five-layer system model for it, naming what belongs in each layer. Then explain how the layers operate together (what flows between them, and in which direction).`,
a:`Sample: a University
L5 Socio-economic SE: national education policy, law, funding, labour-market and social needs; national wealth creation
L4 Industrial SE: higher-education sector and its supply chain: high schools (student supply), industry (graduate demand), publishers, research funders
L3 Business SE: the university as organization: strategy, finance, administration, quality, reputation
L2 Project SE: a degree programme or research project: schedule, budget, team, risk
L1 Product/subsystem SE: the course, curriculum, lab, course material (the innovative artifact)

Layer operation:
- Upper layers constrain lower layers (policy → sector → university → project → course).
- Lower layers feed upper layers (good courses → graduates and research → reputation and revenue → national wealth).
- In L4 the product (graduates) flows toward industry while demand (job needs) flows back the opposite way.
- In L1 a solution is proven by neutralizing the symptoms of the problem.
- Wealth chain: national → industrial → corporate → individual.

Marking: five correct layers with relevant content 10; operation/flows 8; consistent single example 2.`},
{id:"q4",t:"Q4 — Machine Age vs Systems Age",pts:20,body:`<ul><li>a) State the procedure of the Machine Age approach and of the Systems Age approach (3 steps each). (6)</li><li>b) Analyze a hospital with BOTH approaches. (8)</li><li>c) State one limit of the Machine Age approach. (3) Add the one-sentence difference. (3)</li></ul>`,
a:`a) Machine Age: (1) decompose the system into parts, (2) explain the behaviour/properties of each part, (3) aggregate the explanations. Question: HOW does it work?
Systems Age: (1) identify the surrounding environment (containing whole), (2) find the system's mission within it, (3) explain its behaviour/properties from that role. Question: WHY does it exist? Synthesis yields knowledge.

b) Hospital
Machine Age: parts: emergency, surgery, laboratory, pharmacy, wards, staff, budget. Explain each separately (capacity, performance, waiting time). Aggregate: if every unit performs, the hospital performs.
Systems Age: environment: health policy, population, insurance, ambulance services, other hospitals. Mission: protect public health. Explain units through this mission and the flows between them (patient path, delays between emergency and surgery).

c) Limit: parts do not explain the whole; emergence and interactions are missed (delay forms in the arrows between units), leading to sub-optimization.
Difference: machine = "how", systems = "why".`},
{id:"q5",t:"Q5 — Block diagram (FFBD)",pts:20,body:`Draw an FFBD for <b>"Borrowing a book from a library"</b> on paper.<ul><li>Level 1 with at least 6 blocks.</li><li>Expand one block into Level 2 containing at least one AND, one OR and a Go/No-Go.</li><li>Use correct numbering, verb + object text and Ref. blocks.</li></ul>Use the text box to list your blocks, then compare with the model answer.`,
a:`Level 1:
1.0 Find book → 2.0 Check availability → 3.0 Register at desk → 4.0 Borrow book → 5.0 Use book → 6.0 Return book

Level 2 of block 2.0:
[Ref. 1.0 Find book] → 2.1 Search catalog → (AND) 2.2 Check shelf status + 2.3 Check reservation list
→ 2.4 Confirm copy available
   G → [Ref. 3.0 Register at desk]
   G-bar (no copy) → (OR) 2.5 Reserve or request interlibrary loan / 2.6 Choose another book → back to 2.1

Also: dashed line from Level 1 block 2.0 down to Level 2, with "~" under 2.0.

Marking: Level 1 ≥6 blocks 6; numbering and verb+object 4; Ref. blocks 3; AND 2; OR 2; Go/No-Go 2; dashed link 1.`},
{id:"q6",t:"Q6 — Open-system characteristics",pts:10,body:`Apply any FIVE of the nine open-system characteristics to a <b>fast-food restaurant</b> (2 pts each).`,
a:`1 Importation of energy: ingredients, staff, electricity, customer orders.
2 Throughput: preparing, cooking and assembling the order.
3 Output: meals served, waste, revenue.
4 Cycle of events: revenue pays for ingredients and wages, which allow new meals.
5 Negative entropy: new customers, training, supplier deliveries, cleaning and maintenance keep order.
Others: feedback (complaints, manager corrects), homeostasis (staffing adjusts to rush hour), differentiation (cashier, kitchen, drive-through roles), equifinality (order via counter, kiosk or app).`},
{id:"qb",t:"Bonus — Solved, resolved, dissolved",pts:5,bonus:true,body:`Explain "solved, resolved, dissolved" with an example.`,
a:`Solved: a direct solution. Resolved: re-solved for the optimum. Dissolved: the problem disappears.
Example, cold classroom: turn on the heater (solve); find that one student is ill or add a sweater (resolve/redefine); move to the next warm classroom at zero cost (dissolve).`}

 si.oninput=()=>{let v=parseFloat(si.value);if(isNaN(v))delete S.sc[q.id];else S.sc[q.id]=Math.max(0,Math.min(q.pts,v));save();total()};
 d.querySelector("[data-r]").onclick=e=>{const a=$("a_"+q.id);a.classList.toggle("show");const on=a.classList.contains("show");e.target.textContent=on?"Hide model answer":"Show model answer";showDG(q.id,on)};
});
function total(){
 let main=0,bonus=0;
 Q.forEach(q=>{const v=S.sc[q.id]||0;if(q.bonus)bonus+=v;else main+=v});
 $("score").textContent="Score: "+main+" / 100"+(bonus?" (+"+bonus+" bonus)":"");
 return [main,bonus];
}
total();
$("finish").onclick=()=>{
 const [m,b]=total(),t=m+b;
 let msg=t>=85?"Ready. Practise drawing FFBDs faster.":t>=65?"Revise the 9 characteristics, 13 precepts and 5 layers.":"Redo the flashcards (Definitions, Week 2, Machine vs Systems, FFBD), then retake.";
 const r=$("res");r.classList.add("show");r.innerHTML=`<b>Result: ${m} / 100${b?" (+"+b+" bonus)":""}</b><br>${msg}`;
 r.scrollIntoView({behavior:"smooth"});
};
$("clear").onclick=()=>{if(!confirm("Clear all answers and scores?"))return;S={ans:{},sc:{}};save();location.reload()};
// timer
let left=90*60,iv=null;
function draw(){const m=Math.floor(left/60),s=left%60;const el=$("timer");el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");el.classList.toggle("low",left<600)}
draw();
$("start").onclick=()=>{if(iv)return;iv=setInterval(()=>{left--;draw();if(left<=0){clearInterval(iv);iv=null;alert("Time is up!")}},1000)};
$("pause").onclick=()=>{clearInterval(iv);iv=null};
</script>
